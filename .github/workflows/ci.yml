name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    # Linux-only fork: macOS and Windows targets were removed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps.sh --sources /etc/apt/sources.list.d/ubuntu.sources

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check
      - run: cargo test
      - run: npm run test:linux:installer

  flatpak:
    # Validates the Flathub packaging without a full sandbox build (that
    # happens on Flathub infra): manifest parses and downloads, metainfo
    # validates against the AppStream spec, desktop entry validates.
    name: Flatpak manifest + metainfo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            flatpak flatpak-builder appstream desktop-file-utils

      - name: Validate manifest sources
        # The release tag pinned in the manifest may not exist on the branch
        # under test, so validate a copy with a local dir source (this still
        # parses the full manifest and downloads the node toolchain).
        run: |
          node scripts/flatpak-ci-manifest.mjs \
            packaging/flatpak/com.monocode.desktop.yml \
            "$GITHUB_WORKSPACE" /tmp/com.monocode.desktop.ci.yml
          flatpak-builder --download-only \
            --state-dir=/tmp/flatpak-builder-state \
            /tmp/flatpak-builddir \
            /tmp/com.monocode.desktop.ci.yml

      - name: Validate metainfo and desktop entry
        run: |
          appstreamcli validate \
            packaging/flatpak/com.monocode.desktop.metainfo.xml
          desktop-file-validate \
            packaging/flatpak/com.monocode.desktop.desktop

      - name: Lint manifest (gate on new findings)
        # Lints the real manifest (tag + commit pin included); lint is
        # offline, unlike the download-only validation above.
        run: |
          flatpak-builder-lint manifest \
            packaging/flatpak/com.monocode.desktop.yml > /tmp/flatpak-lint.json || true
          node scripts/flatpak-lint-gate.mjs /tmp/flatpak-lint.json

  aur:
    # PKGBUILD lint: syntax, .SRCINFO in sync, namcap clean. The full
    # `makepkg -si` build stays manual (docs/aur.md) — it compiles the
    # whole app and needs the release tag to exist.
    name: AUR packages lint
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packagers tooling
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel pacman-contrib namcap

      - name: Check monocode-bin
        run: |
          cd packaging/aur/monocode-bin
          bash -n PKGBUILD
          diff <(makepkg --printsrcinfo) .SRCINFO
          namcap PKGBUILD

      - name: Check monocode (native)
        run: |
          cd packaging/archlinux/monocode
          bash -n PKGBUILD
          diff <(makepkg --printsrcinfo) .SRCINFO
          namcap PKGBUILD
          desktop-file-validate monocode.desktop
