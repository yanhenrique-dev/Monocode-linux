name: Release

# Linux-only fork: builds the AppImage on Ubuntu and attaches it to the
# GitHub Release, plus a portable tarball (raw binary + desktop entry +
# icons, no AppImage runtime, no pacman). Other bundles (.deb, macOS .dmg,
# Windows .exe) were removed.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage + tarball + GitHub Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps.sh

      - run: npm ci

      - name: Check every version pin matches the tag
        # scripts/check-version.mjs reads the same pin list bump-version.mjs
        # writes, so this covers all twelve copies rather than the three that
        # were checked here. A stale AUR or Flatpak pin is a shipped bug that
        # installs the wrong build, and that is how aur sat at 0.2.17.
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      - name: Build Linux AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:linux

      - name: Repack AppImage without bundled libwayland
        # See scripts/repack-appimage.sh: stale libwayland breaks host Mesa.
        run: bash scripts/repack-appimage.sh

      - name: Sign repacked AppImage and build updater manifest
        # The repack rewrites the AppImage, so the build-time signature is
        # stale: re-sign the final artifact and point latest.json at it.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimage=(target/release/bundle/appimage/*.AppImage)
          if (( ${#appimage[@]} != 1 )); then
            echo "Expected exactly one AppImage" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          npx tauri signer sign "${appimage[0]}"
          node scripts/make-updater-json.mjs \
            "$VERSION" "${appimage[0]}" "${appimage[0]}.sig" latest.json

      - name: Build portable tarball
        # Extract the final (repacked) AppImage once and pack the raw
        # binary + desktop entry + icons. See scripts/make-portable-tarball.sh.
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimage=(target/release/bundle/appimage/*.AppImage)
          if (( ${#appimage[@]} != 1 )); then
            echo "Expected exactly one AppImage" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/make-portable-tarball.sh "$VERSION" "${appimage[0]}" dist

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimage=(target/release/bundle/appimage/*.AppImage)
          tarball=(dist/*.tar.gz)
          if (( ${#appimage[@]} != 1 )) || (( ${#tarball[@]} != 1 )); then
            echo "Expected exactly one AppImage and one tarball" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "MonoCode Linux $VERSION" \
            --notes "See CHANGELOG.md for details." \
            "${appimage[0]}" "${appimage[0]}.sig" latest.json "${tarball[0]}"
