<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/monocode.png" />
    <title>MonoCode</title>
    <script>
      // Browser-preview shim: outside the native webview there is no Tauri
      // IPC bridge, and the bootstrap calls it before React mounts. Install a
      // minimal stub only when the real injection is missing — this block is
      // inert inside the packaged app, where __TAURI_INTERNALS__ exists.
      if (!window.__TAURI_INTERNALS__) {
        (function () {
          var nextCallbackId = 0;
          window.__TAURI_INTERNALS__ = {
            metadata: {
              currentWindow: { label: "main" },
              currentWebview: { label: "main" },
            },
            plugins: {},
            transformCallback: function (callback) {
              var id = nextCallbackId++;
              Object.defineProperty(window, "_" + id, {
                value: callback,
                writable: false,
                configurable: false,
              });
              return id;
            },
            // Unknown commands resolve to null (or [] for list-shaped ones) so
            // `.catch`-guarded calls and feature probes degrade gracefully
            // instead of killing boot. Event listen/unlisten get throwaway ids
            // with harmless unlisten stubs so effect cleanups stay silent.
            invoke: function (cmd) {
              var name = String(cmd);
              if (name === "plugin:event|listen") {
                var eventId = 100000 + nextCallbackId++;
                Object.defineProperty(window, "_" + eventId, {
                  value: { unregisterListener: function () {} },
                  writable: false,
                  configurable: false,
                });
                return Promise.resolve(eventId);
              }
              if (name === "plugin:event|unlisten") return Promise.resolve(null);
              var listy =
                /list|history|sessions|projects|files|entries|dir|skills|worktree|providers|models|accounts|reminders|notes|search/i.test(
                  name,
                );
              return Promise.resolve(listy ? [] : null);
            },
            registerListener: function () {},
            unregisterListener: function () {},
          };
        })();
      }
    </script>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          // Storage access itself can throw (denied cookies, sandbox): guard
          // each read so one failure never interrupts the other restores.
          var storeGet = function (key) {
            try {
              return localStorage.getItem(key);
            } catch (_) {
              return null;
            }
          };
          var hue = storeGet("monocode.themeHue");
          var sat = storeGet("monocode.themeSaturation");
          var darkLightness = storeGet(
            "monocode.themeDarkLightness",
          );
          var opacity = storeGet("monocode.sidebarOpacity");
          if (hue != null) {
            var h = Math.max(0, Math.min(360, Number(hue) || 0));
            root.style.setProperty("--theme-hue", String(h));
          }
          if (sat != null) {
            var s = Math.max(0, Math.min(100, Number(sat) || 0));
            root.style.setProperty("--theme-saturation", s + "%");
          }
          if (darkLightness != null) {
            var l = Math.max(0, Math.min(30, Number(darkLightness) || 0));
            root.style.setProperty("--theme-dark-lightness", l + "%");
          }
          if (opacity != null) {
            var o = Math.max(0.15, Math.min(1, Number(opacity) || 0.85));
            root.style.setProperty("--sidebar-opacity", String(o));
          }
          var scheme = storeGet("monocode.colorScheme");
          if (scheme === "system") {
            scheme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (scheme === "light") {
            root.classList.add("theme-light");
          }
          var bodyGlass = storeGet("monocode.bodyGlass");
          if (bodyGlass == null || bodyGlass === "1" || bodyGlass === "true") {
            root.classList.add("glass-body");
          }
          // Same defaults as src/lib/appearance.ts; initAppearance() corrects
          // everything below a few ms later. sidebarBlur needs the native
          // set_window_background_blur IPC and the chat image needs the Tauri
          // asset URL, so both stay post-init by necessity (see initAppearance).
          var accent = storeGet("monocode.accentColor");
          if (accent != null && /^#[0-9a-fA-F]{6}$/.test(accent)) {
            var ac = accent.toLowerCase();
            var ch = [1, 3, 5].map(function (offset) {
              var v = parseInt(ac.slice(offset, offset + 2), 16) / 255;
              return v <= 0.04045
                ? v / 12.92
                : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            var lum = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
            root.classList.add("has-user-accent");
            root.style.setProperty("--user-accent-color", ac);
            root.style.setProperty(
              "--user-accent-foreground",
              lum > 0.179 ? "#000000" : "#ffffff",
            );
          }
          var uiBlur = storeGet("monocode.uiBlur");
          if (uiBlur === "0" || uiBlur === "false") {
            root.classList.add("no-ui-blur");
          }
          // Number(null) is 0, so a missing key must not fall through to
          // isFinite: only paint when the key exists, keeping the CSS
          // defaults otherwise.
          var bgEmptyRaw = storeGet("monocode.chatBackgroundEmptyOpacity");
          if (bgEmptyRaw != null) {
            var bgEmpty = Number(bgEmptyRaw);
            if (isFinite(bgEmpty)) {
              root.style.setProperty(
                "--chat-background-empty-opacity",
                String(bgEmpty),
              );
            }
          }
          var bgSessionRaw = storeGet("monocode.chatBackgroundSessionOpacity");
          if (bgSessionRaw != null) {
            var bgSession = Number(bgSessionRaw);
            if (isFinite(bgSession)) {
              root.style.setProperty(
                "--chat-background-session-opacity",
                String(bgSession),
              );
            }
          }
          var bgBlurRaw = storeGet("monocode.chatBackgroundBlur");
          if (bgBlurRaw != null) {
            var bgBlur = Number(bgBlurRaw);
            if (isFinite(bgBlur)) {
              root.style.setProperty("--chat-background-blur", bgBlur + "px");
            }
          }
          if (
            storeGet("monocode.chatBackgroundScope") === "empty"
          ) {
            root.classList.add("chat-background-empty-only");
          }
          var uiScale = Number(storeGet("monocode.uiScale"));
          if (isFinite(uiScale) && uiScale > 0) {
            uiScale =
              Math.round(Math.min(2, Math.max(0.5, uiScale)) * 10) / 10;
            root.style.setProperty("zoom", String(uiScale));
          }
          var isMac =
            typeof navigator !== "undefined" &&
            /Mac|iPhone|iPad/.test(navigator.platform);
          if (isMac) {
            root.classList.add("is-mac");
          }
          // Splash motion is opt-in, matching EXPERIMENTAL_ANIMATIONS_DEFAULT
          // being false: the static splash is the resting state and this class
          // only adds the breath and the sweep. Strict "1" because the flag is
          // a feature toggle, not a truthy string. The prefers-reduced-motion
          // block in the boot stylesheet still wins over this.
          if (storeGet("monocode.experimentalAnimations") === "1") {
            root.classList.add("boot-motion");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --theme-hue: 240;
        --theme-saturation: 0%;
        --theme-dark-lightness: 9%;
        --sidebar-opacity: 0.85;
        --background-lightness: var(--theme-dark-lightness);
        --color-background-base: hsl(
          var(--theme-hue) var(--theme-saturation) var(--background-lightness)
        );
      }

      html.theme-light {
        --background-lightness: 97%;
      }

      html,
      body,
      #boot-splash {
        margin: 0;
        background: var(--color-background-base);
      }

      /* Opaque cover until React paints. The logo is in HTML so it is
         visible during the Dock bounce, before the bundle runs. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: opacity 0.16s ease;
      }

      #boot-splash.boot-splash-out {
        opacity: 0;
      }

      #boot-splash img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        display: block;
      }

      /* Indeterminate load bar under the logo. Deliberately NOT a
         determinate 0->100%: the boot has no real progress to report, and a
         fake percentage is a lie. The static state is the resting state and
         the animation is opt-in (html.boot-motion), so the base rules above
         are already correct with no JavaScript at all. */
      #boot-splash::after {
        content: "";
        position: absolute;
        bottom: 30%;
        left: 50%;
        width: 120px;
        height: 2px;
        border-radius: 2px;
        opacity: 0.5;
        background: linear-gradient(
          90deg,
          transparent,
          var(--user-accent-color, var(--color-accent)),
          transparent
        );
      }

      html.boot-motion #boot-splash img {
        animation: boot-breathe 1.2s var(--motion-ease) infinite alternate;
      }

      html.boot-motion #boot-splash::after {
        animation: boot-sweep 1.1s var(--motion-ease) infinite;
      }

      @keyframes boot-breathe {
        from {
          opacity: 0.55;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-50%) scaleX(0);
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
        100% {
          transform: translateX(-50%) scaleX(1);
          opacity: 0;
        }
      }

      /* Last, and matching html.boot-motion specificity on purpose: the OS
         preference has to beat the opt-in. */
      @media (prefers-reduced-motion: reduce) {
        html.boot-motion #boot-splash img,
        html.boot-motion #boot-splash::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/monocode.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
